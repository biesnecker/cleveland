[project]
name = "cleveland"
dynamic = ["version"]
description = "Simple asyncio-based actors."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "John Biesnecker", email = "jbiesnecker@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/biesnecker/cleveland"
Issues = "https://github.com/biesnecker/cleveland/issues"
Changelog = "https://github.com/biesnecker/cleveland/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cleveland/version.py"

[tool.hatch.build.targets.sdist]
include = ["cleveland", "tests", "example.py", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package broke because it relied on deprecated asyncio APIs, so any
# deprecation warning fails the tests.
filterwarnings = ["error"]
